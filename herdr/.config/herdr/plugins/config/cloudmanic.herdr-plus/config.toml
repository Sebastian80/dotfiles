# Both pickers default to a full-screen takeover (projects: zoomed, quick
# actions: overlay), which leaves most of the screen empty for a five-item list.
# popup floats a small window and leaves the tiled layout untouched.
#
# Both pickers are bound as herdr popup *commands* (config.toml [[keys.command]]
# type = "popup", the only placement that takes width/height), which run the
# UI entry points directly. Such a popup's border reads a fixed "popup", so the
# pickers keep their own title bar (title_bar, a fork option) to name themselves.
# placement only applies when the pickers are opened as plugin actions.
[projects]
placement = "popup"
title_bar = true

[quick_actions]
placement = "popup"
title_bar = false

# Plugin panes never receive herdr's theme (herdr discussion #1796), so the
# pickers are coloured here (fork option). Values mirror the [theme.custom]
# tokens in ~/.config/herdr/config.toml; keep the two in step when retheming.
# Each accepts an ANSI index ("6"), a 256-colour index or a hex value.
[theme]
accent = "#7aa2f7"      # theme.custom.accent
accent_soft = "#a9b1d6" # theme.custom.subtext0: tab names in the detail card
muted = "#888fb8"       # theme.custom.overlay0, Lc 39.5 on the ground
match = "#e0af68"       # theme.custom.yellow: fuzzy-match highlights
error = "#ff7874"       # theme.custom.red
header_bg = "#1f2335"   # theme.custom.surface_dim
