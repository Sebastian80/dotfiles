# herdr-nerd-font-tab-name overrides (defaults: the plugin's config/defaults.yml).
# Agent tabs get no program glyph: herdr itself draws the coloured agent state
# icon in front of those (ui.tab_status_icon, local build), so a second glyph
# only doubled it. Tool tabs (shell, lazygit, btop, ...) keep their icons.
# by_agent() falls through agents -> icons -> agent-fallback-icon, so all three
# must be empty for an agent tab to be left alone.
config:
  fallback-icon: "null"
  agent-fallback-icon: "null"
agents:
  claude: ""
  codex: ""
icons:
  claude: ""
  codex: ""
