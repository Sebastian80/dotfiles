# ~/.config/herdr/config.toml - Herdr agent multiplexer (tmux for coding agents)
# Mirrors ~/.tmux.conf muscle memory: = / - splits, hjkl panes, alt+1-9 tabs; prefix is ctrl+space.
# Reload: prefix + r (or `herdr server reload-config`). All defaults: `herdr --default-config`.
# Docs: https://herdr.dev/docs/configuration/

# First-run notification wizard is answered here (see [ui.toast]).
onboarding = false

[theme]
# Herdr's "catppuccin" is Mocha and no Frappé variant exists, so the Mocha base is
# re-tinted below with the Frappé palette Ghostty uses (dark:Catppuccin Frappe).
# "terminal" would reuse the host ANSI palette instead, but loses the UI accents.
name = "catppuccin"

auto_switch = false

# Catppuccin Frappé: base #303446, mantle #292c3c, surface0 #414559, surface1 #51576d,
# accent: Netresearch teal (#2f99a4), the same as the Ghostty tab pills.
[theme.custom]
sidebar_bg = "#292c3c"
panel_bg = "#303446"
active_row_bg = "#414559"
selection_bg = "#51576d"
accent = "#2f99a4"   # Netresearch teal, matches the Ghostty tab CSS
red = "#ff5858"      # Frappé red is a washed-out salmon; this is the same clear red the Ghostty palette overrides ANSI 1 with
green = "#a6d189"
yellow = "#e5c890"
blue = "#8caaee"
# Undocumented but accepted Catppuccin slots (found in the binary's token table).
# They drive the dim text such as inactive tabs; lifted one step brighter than the
# palette's own mapping so inactive tabs stay readable: subtext0 -> Frappé subtext1.
surface0 = "#414559"
surface1 = "#51576d"
overlay0 = "#838ba7"
overlay1 = "#949cbb"
subtext0 = "#b5bfe2"

# The base theme is Mocha, so every token NOT overridden here still renders in
# Mocha's brighter, more saturated hues against a Frappé background — that is
# where the vivid purple in the keybinds sheet came from. These complete the
# palette with Frappé's own values. Accent and red stay deliberately non-Frappé.
# Only these four are real tokens: reload-config rejects lavender/maroon/pink/sky.
mauve = "#babbf1"    # herdr styles key names from this slot. Frappé mauve (#ca9ee6) has red 44 above green, which reads pink; lavender is the same family with no pink cast
peach = "#ef9f76"
teal = "#81c8be"
text = "#c6d0f5"
[update]
# Homebrew owns upgrades (Brewfile). Keep herdr from advertising `herdr update`,
# which would install a second binary outside brew.
version_check = false

[keys]
# ctrl+space: one hand, free in bash (set-mark) and Claude Code; tmux muscle memory kept below
prefix = "ctrl+space"

# Cheat sheet with prefix or plain F1
help = ["prefix+?", "f1"]

# Splits as in tmux: = side by side, - stacked
split_vertical = "prefix+="
split_horizontal = "prefix+minus"

# Tabs: prefix+1-9 or direct alt+1-9 (Ghostty forwards alt+digit as ESC digit, see ghostty config)
switch_tab = ["prefix+1..9", "alt+1..9"]

# tmux habit: prefix+r reloads; resize mode moves to prefix+R
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Direct resize without entering resize mode (tmux prefix+H/J/K/L)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Unbound by default. Agent N directly (the alt digits are free even though the
# alt letters are not), workspaces by number, and tmux's last-pane toggle.
# previous/next_workspace stay unbound: prefix+w already opens the picker.
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+semicolon"

# On-demand tools as focused tabs named after the tool (herdr-tool-tab in dotfiles bin):
# opened at the focused pane's directory, the tab closes when the tool quits.
[[keys.command]]
key = "prefix+alt+g"
type = "shell"
command = "herdr-tool-tab lazygit lazygit"
description = "lazygit in a tab"

[[keys.command]]
key = "prefix+alt+d"
type = "shell"
command = "herdr-tool-tab lazydocker lazydocker"
description = "lazydocker in a tab: compose stack, service logs, exec"

[[keys.command]]
key = "prefix+alt+b"
type = "shell"
command = "herdr-tool-tab btop btop"
description = "btop in a tab"

# Temporary pane beside the agent; ctrl+c closes it. Magento logs in var/log,
# works from any pane whose cwd is a Magento root.
[[keys.command]]
key = "prefix+alt+t"
type = "pane"
command = "tail -n 40 -F var/log/exception.log var/log/system.log var/log/debug.log"
description = "tail Magento logs (var/log) in a temporary pane"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "floax: toggle the floating scratch shell of this workspace"

[worktrees]
# Under ~/workspace so Claude Code's additionalDirectories cover agent worktrees
directory = "~/workspace/.worktrees"

[ui]
# Right side of the tab bar, like the tmux status-right
tab_bar_right = [{ type = "hostname" }, { type = "datetime", format = "%H:%M" }]
tab_bar_right_separator = " · "

status_indicators = "dots"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[ui.toast]
# Desktop notification through Ghostty when a background agent needs attention or finishes
delivery = "herdr"

[experimental]
# Pane screen history across server restarts is OFF: it lands as plaintext in
# session-history.json and these panes carry prod shell output and credentials.
pane_history = false
# Pass kitty graphics through to Ghostty so terminal-browser can render inside a pane
kitty_graphics = true

# Command palette (herdr-action-palette in dotfiles bin): fzf over every action of
# every installed plugin. Annotate, hunkdiff's other reviews, the plugin manager and
# the file explorer live here instead of holding a key each. prefix+p would collide
# with herdr's own previous_tab, so this is a double tap of the prefix. Needs fzf
# and jq.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "herdr-action-palette"
width = "80%"
height = "70%"
description = "command palette: fuzzy-pick any plugin action"

# Styling trial (2026-09-07): the theme picker maps a terminalcolors.com palette
# into [theme.custom] and syncs the ANSI colours to Ghostty via OSC. Nerd-font tab
# icons run as a watcher started by the plugin; they compete with auto-title for
# the tab label, see the notes in the trial. Keeps its own key: opening it from
# the palette would be a popup inside a popup.
[[keys.command]]
key = "prefix+alt+y"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "theme picker: pick a palette for the herdr UI"

# herdr-plus runs from a LINKED LOCAL FORK at ~/workspace/herdr-plus (branch
# teal-theme), not from the marketplace: both pickers hardcode magenta and a
# lavender title bar, which herdr cannot override because plugin panes never see
# its theme (herdr discussion #1796). A linked plugin is never auto-updated, so
# pull upstream by hand and rebuild with `sh scripts/build.sh`.
#
# herdr-plus (cloudmanic.herdr-plus): Projects are workspace templates in
# plugins/config/cloudmanic.herdr-plus/projects (symlinked into the dotfiles
# package); picking one builds a whole workspace with its tabs and commands.
# Quick Actions are one-off commands from quick-actions/, run in the directory
# you launched from. Its worktree auto-layout is unused: that needs files in
# ~/.config/herdr-plus/worktrees/, and worktrees here are created by hand outside
# herdr, so herdr never fires the event that would drive it.
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: open a project as a new workspace"

[[keys.command]]
key = "prefix+alt+q"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: run a quick action here"

# herdr-yazi (ray.file-explorer): yazi at the focused pane's directory, in a new
# focused tab (full width; a split is too narrow for three columns plus preview).
[[keys.command]]
key = "prefix+alt+e"
type = "shell"
command = "herdr-tool-tab yazi yazi"
description = "yazi in a tab"

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review working tree / branch diff (prefix+shift+h is pane resize)"
