# ~/.config/herdr/config.toml - Herdr agent multiplexer (tmux for coding agents)
# Mirrors ~/.tmux.conf muscle memory: = / - splits, hjkl panes, alt+1-9 tabs; prefix is ctrl+space.
# Reload: prefix + r (or `herdr server reload-config`). All defaults: `herdr --default-config`.
# Docs: https://herdr.dev/docs/configuration/

# First-run notification wizard is answered here (see [ui.toast]).
onboarding = false

[theme]
# Herdr's own themes are all Catppuccin; there is no TokyoNight base, so the
# Mocha base is re-tinted below with the Storm palette Ghostty uses
# (dark:nr-tokyonight). "terminal" would reuse the host ANSI palette instead,
# but loses the UI accents.
name = "catppuccin"

auto_switch = false

# TokyoNight Storm, chosen on measurement rather than taste: of every dark theme
# Ghostty ships, Storm has the narrowest APCA band for the colours you actually
# read (Lc 47-72, span 24.5; nr-frappe spanned 40.9). A wide band is what makes a
# dark theme tiring -- the eye re-adapts on every glance between a bright glyph
# and a dim one. Moving the background cannot fix that: swept from Y=0.014 to
# Y=0.054, the span stayed 67.1 at every step, so only the colours can compress it.
#
# Canonical Storm values (folke/tokyonight.nvim, lua/tokyonight/colors/storm.lua):
# bg #24283b, bg_highlight #292e42, fg_gutter #3b4261, terminal_black #414868,
# dark3 #545c7e, dark5 #737aa2, fg_dark #a9b1d6, fg #c0caf5.
[theme.custom]
# sidebar_bg is deliberately Storm's own bg, so the herdr sidebar and the shell
# inside a pane share one ground and panels sit visibly above it.
#
# The two fills below are the accent composited over that ground at low alpha,
# the sRGB blend CSS rgba() would produce. A terminal cell has no alpha channel,
# so this is pre-computed rather than applied at draw time -- which is exactly
# equivalent here, because the ground under them never varies. Structure stays
# neutral (panel_bg is Storm's own bg_highlight) and only interaction carries the
# accent tint, so a selected row reads as selected rather than merely lighter.
sidebar_bg = "#24283b"
panel_bg = "#292e42"       # bg_highlight, neutral: structure, not state
active_row_bg = "#333e5d"  # accent @ 18%
selection_bg = "#3c4a70"   # accent @ 28%, one clear step above the row
# Storm's own blue, the hue the palette is built around. It replaced the relit
# Netresearch teal (#6ccfdb, Lc 65.4) once herdr-plus could be themed: one quiet
# accent across herdr and its pickers beats a brand hue that only herdr showed.
accent = "#7aa2f7"
# Active tab on its own tokens (local herdr build from ~/workspace/herdr-src,
# branch tab-active-tokens, after discussion #2215). The stock binary ignores
# these two keys and paints the tab with accent as before.
tab_active_bg = "#333e5d"  # accent @ 18%, the same lift as the active sidebar row
tab_active_fg = "#c0caf5"  # text: the state icon carries the colour, the label stays quiet
tab_inactive_bg = "#292e42" # bg_highlight, the panel ground
tab_inactive_fg = "#888fb8" # overlay0
tab_blocked_bg = "#4b3645"  # red @ 18%: a blocked agent's tab, focused or not
red = "#ff7874"            # clear red relit to L=0.78; Storm's own #f7768e leans pink
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
# Documented in the config reference under theme.custom, despite reading like internals.
# They drive the dim text such as inactive tabs; mapped onto Storm's own
# de-emphasis ramp so inactive tabs stay readable without joining the bright band.
surface0 = "#3b4261"       # fg_gutter
surface1 = "#414868"       # terminal_black
surface_dim = "#1f2335"    # bg_dark. The 19th documented token; unset it stayed on the Mocha base
# Storm's own dark3/dark5 measure Lc 15.9 and 29.3 on this ground, which put the
# branch names and agent sub-lines below the threshold for readable text. Relit in
# OKLab with Storm's hue held, back to the lift the Frappe mapping had (Lc 36.8/45.6).
overlay0 = "#888fb8"       # dark5 relit to L=0.66, Lc 39.5
overlay1 = "#949cc5"       # dark5 relit to L=0.70, Lc 46.1
subtext0 = "#a9b1d6"       # fg_dark

# The base theme is Mocha, so every token NOT overridden here still renders in
# Mocha's brighter, more saturated hues against a Storm background -- that is
# where the vivid purple in the keybinds sheet came from. These complete the
# palette. Only these four are real tokens: reload-config rejects lavender/maroon/pink/sky.
mauve = "#c0caf5"    # key names. Same value as text: the sheet already carries teal structure, and a second hue for keys just competes. Bold weight carries the distinction instead
peach = "#ff9e64"    # Storm's orange
teal = "#9ece6a"     # herdr paints the DONE state icon with this token; green so done reads as done. The brand teal lives in accent, not here
text = "#c0caf5"
[update]
# Homebrew owns upgrades (Brewfile). Keep herdr from advertising `herdr update`,
# which would install a second binary outside brew.
version_check = false

[keys]
# ctrl+space: one hand, free in bash (set-mark) and Claude Code; tmux muscle memory kept below
prefix = "ctrl+space"

# Cheat sheet with prefix or plain F1
help = ["prefix+?", "f1"]

# Splits as in tmux: = side by side, - stacked
split_vertical = "prefix+="
split_horizontal = "prefix+minus"

# Tabs: prefix+1-9 or direct alt+1-9 (Ghostty forwards alt+digit as ESC digit, see ghostty config)
switch_tab = ["prefix+1..9", "alt+1..9"]

# tmux habit: prefix+r reloads; resize mode moves to prefix+R
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Direct resize without entering resize mode (tmux prefix+H/J/K/L)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Unbound by default. Agent N directly (the alt digits are free even though the
# alt letters are not), workspaces by number, and tmux's last-pane toggle.
# previous/next_workspace stay unbound: prefix+w already opens the picker.
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+semicolon"

# On-demand tools as focused tabs named after the tool (herdr-tool-tab in dotfiles bin):
# opened at the focused pane's directory, the tab closes when the tool quits.
[[keys.command]]
key = "prefix+alt+g"
type = "shell"
command = "herdr-tool-tab lazygit lazygit"
description = "lazygit in a tab"

[[keys.command]]
key = "prefix+alt+d"
type = "shell"
command = "herdr-tool-tab lazydocker lazydocker"
description = "lazydocker in a tab: compose stack, service logs, exec"

[[keys.command]]
key = "prefix+alt+b"
type = "shell"
command = "herdr-tool-tab btop btop"
description = "btop in a tab"

# Temporary pane beside the agent; ctrl+c closes it. Magento logs in var/log,
# works from any pane whose cwd is a Magento root.
[[keys.command]]
key = "prefix+alt+t"
type = "pane"
command = "tail -n 40 -F var/log/exception.log var/log/system.log var/log/debug.log"
description = "tail Magento logs (var/log) in a temporary pane"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "floax: toggle the floating scratch shell of this workspace"

[worktrees]
# Under ~/workspace so Claude Code's additionalDirectories cover agent worktrees
directory = "~/workspace/.worktrees"

[ui]
# Right side of the tab bar, like the tmux status-right
tab_bar_right = [{ type = "hostname" }, { type = "datetime", format = "%H:%M" }]
tab_bar_right_separator = " · "

# "dots" separates five states by colour and fill alone (hollow ring = idle,
# filled = working or done-unseen). "symbols" gives each state its own shape, so
# blocked/working/done/idle/unknown are distinguishable without relying on fill.
status_indicators = "symbols"
# Coloured agent state icon in front of each agent tab (local build, see the
# tab_active_* tokens). The glyph comes from [ui.status_icons] below.
tab_status_icon = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Distinct from theme.custom.accent: this one drives highlights, borders and the
# navigate UI, and defaults to the bare name "cyan". Pinned to the same Storm
# blue so there is one accent rather than three.
accent = "#7aa2f7"

# Nerd Font glyphs per state, drawn in the state colour everywhere the icon
# appears. Unset states keep the "symbols" preset.
[ui.status_icons]
working = "\U000f0451" # nf-md-progress_clock
blocked = "\U000f0026" # nf-md-alert
done    = "\U000f012c" # nf-md-check_bold
idle    = "\U000f0765" # nf-md-sleep

[ui.sidebar.agents]
# Default is [["state_icon","workspace","tab"],["agent"]]. "tab" is dropped because
# tabs here are named after the agent, so it rendered "* claude" on nearly every
# row. "agent" stays: it carries the reported session name, the only field that
# tells two workspaces with the same name apart (cod-flake vs claude). Keeping it
# on its own second row leaves the workspace name the full sidebar width, so
# nothing truncates.
rows = [["state_icon", "workspace"], ["agent"]]

# row_gap defaults to 0, which packs entries with no separation and runs the rows
# of one agent into the next. 1 puts a blank line between entries, so each agent
# reads as one block rather than a wall of lines.
row_gap = 1

[ui.sidebar.spaces]
# Layout left at the default: the second row carries the branch, which is real
# information rather than a repeat of the first. Only the spacing changes.
row_gap = 1

[ui.toast]
# Desktop notification through Ghostty when a background agent needs attention or finishes
delivery = "herdr"

[experimental]
# Pane screen history across server restarts is OFF: it lands as plaintext in
# session-history.json and these panes carry prod shell output and credentials.
pane_history = false
# Pass kitty graphics through to Ghostty so terminal-browser can render inside a pane
kitty_graphics = true

# Command palette (herdr-action-palette in dotfiles bin): fzf over every action of
# every installed plugin. Annotate, hunkdiff's other reviews, the plugin manager and
# the file explorer live here instead of holding a key each. prefix+p would collide
# with herdr's own previous_tab, so this is a double tap of the prefix. Needs fzf
# and jq.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "herdr-action-palette"
width = "80%"
height = "70%"
description = "command palette: fuzzy-pick any plugin action"

# Styling trial (2026-09-07): the theme picker maps a terminalcolors.com palette
# into [theme.custom] and syncs the ANSI colours to Ghostty via OSC. Nerd-font tab
# icons run as a watcher started by the plugin; they compete with auto-title for
# the tab label, see the notes in the trial. Keeps its own key: opening it from
# the palette would be a popup inside a popup.
[[keys.command]]
key = "prefix+alt+y"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "theme picker: pick a palette for the herdr UI"

# herdr-plus runs from a LINKED LOCAL FORK at ~/workspace/herdr-plus (branch
# teal-theme), not from the marketplace: both pickers hardcode magenta and a
# lavender title bar, which herdr cannot override because plugin panes never see
# its theme (herdr discussion #1796). A linked plugin is never auto-updated, so
# pull upstream by hand and rebuild with `sh scripts/build.sh`.
#
# herdr-plus (cloudmanic.herdr-plus): Projects are workspace templates in
# plugins/config/cloudmanic.herdr-plus/projects (symlinked into the dotfiles
# package); picking one builds a whole workspace with its tabs and commands.
# Quick Actions are one-off commands from quick-actions/, run in the directory
# you launched from. Its worktree auto-layout is unused: that needs files in
# ~/.config/herdr-plus/worktrees/, and worktrees here are created by hand outside
# herdr, so herdr never fires the event that would drive it.
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: open a project as a new workspace"

[[keys.command]]
key = "prefix+alt+q"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: run a quick action here"

# herdr-yazi (ray.file-explorer): yazi at the focused pane's directory, in a new
# focused tab (full width; a split is too narrow for three columns plus preview).
[[keys.command]]
key = "prefix+alt+e"
type = "shell"
command = "herdr-tool-tab yazi yazi"
description = "yazi in a tab"

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review working tree / branch diff (prefix+shift+h is pane resize)"
