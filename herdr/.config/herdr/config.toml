# ~/.config/herdr/config.toml - Herdr agent multiplexer (tmux for coding agents)
# Mirrors ~/.tmux.conf muscle memory: = / - splits, hjkl panes, alt+1-9 tabs; prefix is ctrl+space.
# Reload: prefix + r (or `herdr server reload-config`). All defaults: `herdr --default-config`.
# Docs: https://herdr.dev/docs/configuration/

# First-run notification wizard is answered here (see [ui.toast]).
onboarding = false

[theme]
# "terminal" reuses the host ANSI palette, so Ghostty's Catppuccin Frappé/Latte
# auto-switching carries over. Herdr's own "catppuccin" is Mocha; no Frappé variant exists.
name = "catppuccin"

auto_switch = false
[update]
# Homebrew owns upgrades (Brewfile). Keep herdr from advertising `herdr update`,
# which would install a second binary outside brew.
version_check = false

[keys]
# ctrl+space: one hand, free in bash (set-mark) and Claude Code; tmux muscle memory kept below
prefix = "ctrl+space"

# Cheat sheet with prefix or plain F1
help = ["prefix+?", "f1"]

# Splits as in tmux: = side by side, - stacked
split_vertical = "prefix+="
split_horizontal = "prefix+minus"

# Tabs: prefix+1-9 or direct alt+1-9 (Ghostty forwards alt+digit as ESC digit, see ghostty config)
switch_tab = ["prefix+1..9", "alt+1..9"]

# tmux habit: prefix+r reloads; resize mode moves to prefix+R
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Direct resize without entering resize mode (tmux prefix+H/J/K/L)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# On-demand tools: the agent keeps the screen, these appear over it and vanish.
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "lazydocker"
description = "lazydocker: compose stack, service logs, exec"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
description = "btop: system monitor"
width = "90%"
height = "90%"

# Temporary pane beside the agent; ctrl+c closes it. Magento logs in var/log,
# works from any pane whose cwd is a Magento root.
[[keys.command]]
key = "prefix+alt+t"
type = "pane"
command = "tail -n 40 -F var/log/exception.log var/log/system.log var/log/debug.log"
description = "tail Magento logs (var/log) in a temporary pane"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "floax: toggle the floating scratch shell of this workspace"

# Plugins (installed with `herdr plugin install`, state under ~/.config/herdr/plugins/)
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: diff review sidebar, send comments back to the agent"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "herdr-spreader.apply"
description = "spreader: apply the workspace layout from plugins/config/herdr-spreader/config.yaml"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "plugin manager popup: install, update, enable, disable, browse the marketplace"

[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "herdr-plugin-workspace-manager.apply"
description = "workspace manager: apply the repo's layout (plugins/config/herdr-plugin-workspace-manager/config.yml) to this workspace"

[worktrees]
# Under ~/workspace so Claude Code's additionalDirectories cover agent worktrees
directory = "~/workspace/.worktrees"

[ui]
# Right side of the tab bar, like the tmux status-right
tab_bar_right = [{ type = "hostname" }, { type = "datetime", format = "%H:%M" }]
tab_bar_right_separator = " · "

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[ui.toast]
# Desktop notification through Ghostty when a background agent needs attention or finishes
delivery = "herdr"

[experimental]
# Pane screen history across server restarts is OFF: it lands as plaintext in
# session-history.json and these panes carry prod shell output and credentials.
pane_history = false
# Pass kitty graphics through to Ghostty so terminal-browser can render inside a pane
kitty_graphics = true

# herdr-annotate (plannotator/herdr-annotate): comment on terminal text, review markdown
# and agent replies in plannotator-tui, send the notes to the agent. README suggests
# prefix+a/o; prefix+o is herdr's open_notification_target, so these stay in the
# prefix+alt namespace with the other plugins.
[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate: comment on selected terminal text"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "annotate.copy-context"
description = "annotate: copy all annotations as markdown"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "annotate.manage"
description = "annotate: manage annotations"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review markdown files in this folder"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "annotate.last"
description = "annotate: review the agent's last reply"

# Styling trial (2026-09-07): theme picker maps a terminalcolors.com palette into
# [theme.custom] below and syncs the ANSI colours to Ghostty via OSC. Nerd-font tab
# icons run as a watcher started by the plugin; they compete with auto-title for
# the tab label, see the notes in the trial.
[[keys.command]]
key = "prefix+alt+y"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "theme picker: pick a palette for the herdr UI"

# herdr-icon-agent-ui: sidebar agent rows with the harness logo and an animated state
# line. $state_* tokens come from the plugin (exactly one is set per pane); the logo
# glyph sits in the same coloured line so herdr draws no "·" separators.
# Colours: working = Claude orange, done = green, blocked = red, idle/unknown = dim.
[ui.sidebar.agents.rows_by_agent]
claude = [["workspace"], [{ token = "$state_working", fg = "#d97757" }, { token = "$state_done", fg = "#a6d189" }, { token = "$state_blocked", fg = "#e78284" }, { token = "$state_idle", fg = "#737994" }, { token = "$state_unknown", fg = "#737994" }], ["terminal_title_stripped"]]
codex  = [["workspace"], [{ token = "$state_working", fg = "#d97757" }, { token = "$state_done", fg = "#a6d189" }, { token = "$state_blocked", fg = "#e78284" }, { token = "$state_idle", fg = "#737994" }, { token = "$state_unknown", fg = "#737994" }], ["terminal_title_stripped"]]
