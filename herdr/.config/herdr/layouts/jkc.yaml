# herdr-spreader layout for the JKC B2B shop (Magento 2.4.7, docker compose stack).
# Apply: herdr-spreader apply --file ~/.config/herdr/layouts/jkc.yaml
# Every apply creates a NEW workspace; close the old one first or you get two.
#
# The agent owns the screen; tools appear on demand and vanish:
#   prefix+alt+g lazygit popup      prefix+alt+d lazydocker popup   prefix+alt+b btop popup
#   prefix+alt+t Magento log tail   prefix+alt+f floating scratch shell
#   prefix+alt+h hunk diff review    prefix+alt+l annotate the agent's last reply
# Parallel agents get their own tab (prefix+c), not a split: 108 columns is too
# narrow for two.
workspaces:
  - name: jkc
    root: ~/workspace/jkc-magento
    focus: true
    tabs:
      # --continue resumes the most recent conversation in this repo, or starts
      # a fresh one when there is none.
      - label: claude
        panes:
          - command: claude --continue
            focus: true
      # bin/magento via the setup container, docker compose, magerun2, deployer,
      # and the incident scripts under .claude/.
      - label: shell
        panes:
          - {}
