# Local plugin, linked not installed. Replaces herdr's built-in state_icon in the
# Agents panel with a Nerd Font glyph per state, published as the $icon token.
# herdr's own icon accepts a colour but never a different character, and its two
# built-in sets (dots, symbols) are the only choice, so the glyph has to come
# from a token. A rule in the row definition colours it by value.
id = "nr.state-icons"
name = "State Icons"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Nerd Font state glyphs for the Agents panel, as the $icon token"
platforms = ["linux", "macos"]

[[startup]]
command = ["./state-icons"]

# The token is a snapshot of the state, so it is refreshed whenever an agent
# appears or changes state. Tokens do not survive a server restart; startup
# above covers that.
[[events]]
on = "pane.agent_detected"
command = ["./state-icons"]

[[events]]
on = "pane.agent_status_changed"
command = ["./state-icons"]

[[actions]]
id = "refresh"
title = "State icons: refresh"
contexts = ["workspace"]
command = ["./state-icons"]

[[actions]]
id = "clear"
title = "State icons: clear tokens"
contexts = ["workspace"]
command = ["./state-icons", "--clear"]
