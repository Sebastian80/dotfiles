# A local plugin, linked rather than installed, so nothing here comes from a
# third party and nothing auto-updates.
#
# It exists because herdr has no config-level startup hook: custom sidebar
# tokens are runtime state and have to be re-reported after every herdr
# restart. Plugins are the only thing herdr runs at startup, so the plugin is
# the wrapper, not the feature. The feature is one script.
id = "nr.space-groups"
name = "Space Groups"
version = "0.1.0"
# report-metadata and $name sidebar tokens were verified working on 0.8.2.
min_herdr_version = "0.8.2"
description = "Tag each Space with its project group, rendered as $group in the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["./space-groups"]

# Also exposed as an action so it can be re-run by hand from the palette after
# opening a workspace, without restarting herdr.
[[actions]]
id = "retag"
title = "Space groups: re-tag all Spaces"
contexts = ["workspace"]
command = ["./space-groups"]
