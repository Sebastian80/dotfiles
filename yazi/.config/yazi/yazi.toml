# Yazi Configuration
# Rich preview plugin for formatted markdown, JSON, CSV, etc.

# ========================================
# Manager Settings
# ========================================
[mgr]
ratio = [1, 3, 5]          # Pane ratio [parent, current, preview] - gives more space to preview
show_hidden = true         # Show hidden files by default
scrolloff = 5              # Keep 5 lines of context above/below cursor
sort_by = "alphabetical"   # Sort files alphabetically
sort_reverse = false       # Normal sort order (A-Z)
show_symlink = true        # Show symlink targets
linemode = "mtime"         # Display modification time (options: none, size, mtime, permissions, owner)

# ========================================
# Preview Settings
# ========================================
[preview]
tab_size = 2               # Tab width in preview pane
max_width = 1000           # Maximum preview width in pixels (balanced for performance)
max_height = 1200          # Maximum preview height in pixels (balanced for performance)
image_quality = 75         # Image preview quality (50-90, higher = better but slower)

# ========================================
# Performance Settings
# ========================================
[tasks]
micro_workers = 5          # Number of concurrent micro tasks (default, safer for USB/network)
macro_workers = 10         # Number of concurrent macro tasks
bizarre_retry = 3          # Retry count for failed tasks

# ========================================
# Plugin Configuration
# ========================================
[plugin]
prepend_previewers = [
    # ========================================
    # Markdown - Use rich-preview plugin (previewer rules use `url =`, yazi 26+)
    # ========================================
    # rich-cli 1.8.0 provides markdown preview with:
    # - Automatic format detection
    # - Syntax highlighting and pretty-printing
    # - Rounded panels with guides
    # Note: piper plugin requires yazi 25.9.15+, so using rich-preview directly
    { url = "*.md", run = "rich-preview" },

    # ========================================
    # Data Formats - Use rich-preview plugin
    # ========================================
    # rich-cli 1.8.0 handles structured data formats with:
    # - Automatic format detection
    # - Syntax highlighting and pretty-printing
    # - Rounded panels and guides
    { url = "*.json", run = "rich-preview" },
    { url = "*.csv", run = "rich-preview" },
    { url = "*.rst", run = "rich-preview" },
    { url = "*.ipynb", run = "rich-preview" },
    { url = "*.xml", run = "rich-preview" },
    { url = "*.yaml", run = "rich-preview" },
    { url = "*.yml", run = "rich-preview" },
    { url = "*.toml", run = "rich-preview" }
]
